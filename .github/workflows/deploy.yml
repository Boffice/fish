name: Deploy to GitHub Pages

# Publishes the static site. The app is plain HTML/CSS/JS at the repo root,
# so the whole directory is uploaded as-is — no build step.

on:
  push:
    branches:
      - main
      - claude/fishing-trip-planner-7bW0g
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Let the workflow enable Pages itself (build_type: workflow) so no
          # manual Settings step is needed. Uses the job's pages:write token.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
